name: Validate firmware and web flasher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install firmware tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Build firmware and install its pinned image validation tools
        run: .venv/bin/pio run -e sticks3
      - name: Test configuration, packaging and firmware logic
        run: |
          .venv/bin/python -m unittest discover -s scripts/tests -v
          .venv/bin/pio test -e native
      - name: Package firmware
        run: |
          .venv/bin/python scripts/package_firmware.py --version 0.0.0-dev --output web/public/firmware
      - name: Test and build website
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run check
          npm test
          npm run build

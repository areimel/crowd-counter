[platformio]
; Local, uncommitted settings (upload_port, monitor_port) go in platformio_override.ini.
extra_configs = platformio_override.ini

[env]
monitor_speed = 115200

[env:sticks3]
; pioarduino 55.03.312-1 = Arduino-ESP32 3.3.x (latest stable at time of pinning).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
extra_scripts = pre:scripts/platformio_config.py
board = esp32-s3-devkitc-1
; Custom table: no coredump partition, so a crash can never write radio-task
; stacks (which may hold an address in flight) to flash.
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.36

[env:native]
; Host tests for the pure-logic libraries: pio test -e native
platform = native
test_framework = unity
lib_ignore = board, radio, store, display
build_flags = -std=gnu++17 -Wall -Wextra
